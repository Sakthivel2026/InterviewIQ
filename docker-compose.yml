version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production_super_secret_jwt_key_2026
      - JWT_REFRESH_SECRET=production_super_secret_refresh_key_2026
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLIENT_URL=http://localhost:5000
      - UPLOAD_DIR=uploads
    volumes:
      - app_data:/app/server/uploads
    restart: unless-stopped

volumes:
  app_data:
